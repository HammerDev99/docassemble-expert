# Cosecha las entrevistas del Suffolk LIT Lab y sus aliados y sincroniza el vector store de OpenAI.
# Se ejecuta a mano desde la pestaña Actions ("Run workflow").
#
# Por defecto NO poda: si un repositorio de origen se borra, se vuelve privado o cambia de licencia, su paquete se
# conserva en el vector store tal como estaba. La poda solo ocurre si se marca la casilla "podar".
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   OPENAI_API_KEY   clave de la API de OpenAI
#   VECTOR_STORE_ID  vs_... del vector store que usa la app
#   CORPUS_DEPLOY_KEY  llave de despliegue con escritura sobre HammerDev99/docassemble-corpus (respaldo privado)
# GitHub los oculta en los registros y no los entrega a pull requests de forks.

name: Actualizar base de conocimiento

on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo mostrar qué cambiaría, sin tocar el vector store"
        type: boolean
        default: false
      podar:
        description: "Borrar del vector store los paquetes cuyo repositorio ya no se encuentra"
        type: boolean
        default: false
      forzar_poda:
        description: "Con podar: permitir borrar más del 10 % de los paquetes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vector-store
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "openai>=3.0.0,<4.0.0" "PyYAML>=6.0" "PyPDF2>=3.0.0" "requests>=2.28.0"

      - name: Restaurar clones de la cosecha anterior
        uses: actions/cache@v4
        with:
          path: .cache/suffolk/repos
          key: suffolk-repos-${{ github.run_id }}
          restore-keys: suffolk-repos-

      - name: Cosechar paquetes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cosechar_suffolk.py

      - name: Sincronizar vector store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
          SIMULAR: ${{ inputs.simular }}
          PODAR: ${{ inputs.podar }}
          FORZAR_PODA: ${{ inputs.forzar_poda }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$VECTOR_STORE_ID" ]; then
            echo "::error::Faltan los secretos OPENAI_API_KEY o VECTOR_STORE_ID."
            exit 1
          fi
          args=(--vector-store-id "$VECTOR_STORE_ID" --sincronizar)
          [ "$SIMULAR" = "true" ] && args+=(--dry-run)
          [ "$PODAR" = "true" ] && args+=(--podar)
          [ "$FORZAR_PODA" = "true" ] && args+=(--forzar-poda)
          python scripts/crear_vector_store.py "${args[@]}" | grep -v "^  - knowledge/suffolk/paquetes/"

      - name: Respaldar corpus en docassemble-corpus
        if: ${{ !inputs.simular }}
        env:
          CORPUS_DEPLOY_KEY: ${{ secrets.CORPUS_DEPLOY_KEY }}
          CORPUS_REPO: HammerDev99/docassemble-corpus
        run: |
          if [ -z "$CORPUS_DEPLOY_KEY" ]; then
            echo "::warning::Falta el secreto CORPUS_DEPLOY_KEY; se omite el respaldo."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CORPUS_DEPLOY_KEY" > ~/.ssh/corpus_key
          chmod 600 ~/.ssh/corpus_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/corpus_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 "git@github.com:${CORPUS_REPO}.git" respaldo
          # Se copia sin borrar: los paquetes cuyo repositorio de origen desapareció se conservan.
          mkdir -p respaldo/paquetes
          cp knowledge/suffolk/paquetes/*.md respaldo/paquetes/
          cp knowledge/suffolk/_catalogo.md .cache/suffolk/catalogo.json respaldo/
          cd respaldo
          git add -A
          if git diff --cached --quiet; then
            echo "Respaldo sin cambios."
            exit 0
          fi
          git diff --cached --stat | tail -1
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "respaldo: corpus $(date -u +%F) (ejecución ${GITHUB_RUN_ID})"
          git push -q origin HEAD:main
